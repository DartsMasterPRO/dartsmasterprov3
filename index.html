*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e8e8f0;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{text-align:center;padding:20px;max-width:600px}
h1{font-family:'Bebas Neue',cursive;font-size:48px;letter-spacing:2px;color:#ff3c3c;margin-bottom:20px}
.logo{width:min(70vw,320px);height:auto;margin:20px auto;display:block}
p{font-size:18px;color:#8888aa;margin:15px 0}
.btn{background:linear-gradient(135deg,#ff3c3c,#cc1f1f);color:#fff;border:none;padding:15px 40px;font-size:18px;border-radius:10px;cursor:pointer;font-family:'Bebas Neue',cursive;letter-spacing:1px;margin:20px 0;width:100%;max-width:400px;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,60,60,0.4)}
.btn:active{transform:translateY(0)}
.btn#installBtn{display:none}
.info{background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.3);border-radius:10px;padding:20px;margin:30px 0;font-size:16px}
.success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);color:#00ff88;display:none;padding:15px;border-radius:10px;margin:20px 0;font-weight:bold}
.offline{background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.3);color:#ffc107;display:none;padding:15px;border-radius:10px;margin:20px 0}

<h1>Graj. Trenuj. Wygrywaj.</h1>
<p>Aplikacja do liczenia punktów, analizy statystyk i rozwoju umiejętności.</p>

<div class="info">
📱 Zainstaluj aplikację dla najlepszych wrażeń!
</div>

<button class="btn" id="installBtn" onclick="install()">
📱 ZAINSTALUJ APLIKACJĘ
</button>

<button class="btn" style="background:#1a1a26;border:1px solid #2a2a40;color:#e8e8f0;margin-top:10px" onclick="window.location.href='/app.html'">
▶ ZAGRAJ TERAZ
</button>

<div class="success" id="success">
✅ Aplikacja zainstalowana pomyślnie!
</div>

<div class="offline" id="offline">
⚠️ Offline - ale aplikacja działa!
</div>
</div>

<script>
// Register Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js', { scope: './' })
    .then(reg => {
      console.log('✅ Service Worker zarejestrowany');
      // Sprawdzaj aktualizacje co 30 minut
      setInterval(() => reg.update(), 30*60*1000);
    })
    .catch(e => console.log('⚠️ SW error:', e));
}

// Offline detection
function updateOfflineBanner(){
  document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('offline', updateOfflineBanner);
window.addEventListener('online', updateOfflineBanner);

let deferredPrompt;

// Przechwycenie prompt'a instalacji
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('✅ Prompt instalacji gotowy');
  // Pokaż przycisk instalacji tylko gdy przeglądarka faktycznie go obsługuje
  document.getElementById('installBtn').style.display = 'inline-block';
});

function install() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      if (choice.outcome === 'accepted') {
        console.log('✅ Użytkownik zaakceptował instalację');
        document.getElementById('success').style.display = 'block';
        document.getElementById('installBtn').style.display = 'none';
      } else {
        console.log('❌ Użytkownik odrzucił instalację');
      }
      deferredPrompt = null;
    }).catch(err => {
      console.error('Błąd podczas instalacji:', err);
    });
  } else {
    // Fallback dla przeglądarek bez native prompt'a (np. iOS Safari)
    const userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.includes('safari') && !userAgent.includes('chrome')) {
      alert('📱 Kliknij Udostępnij > "Dodaj do ekranu głównego"');
    } else if (userAgent.includes('firefox')) {
      alert('📱 Kliknij menu (⋮) > "Zainstaluj aplikację"');
    } else if (userAgent.includes('chrome')) {
      alert('📱 Kliknij menu (⋮) > "Zainstaluj aplikację" lub "Dodaj do ekranu głównego"');
    } else {
      alert('📱 Użyj menu przeglądarki aby zainstalować aplikację');
    }
  }
}

// Ukryj przycisk instalacji jeśli już zainstalowana
window.addEventListener('appinstalled', () => {
  console.log('✅ Aplikacja zainstalowana!');
  document.getElementById('success').style.display = 'block';
  document.getElementById('installBtn').style.display = 'none';
  deferredPrompt = null;
});

// Sprawdź stan przy starcie: standalone mode oraz offline
window.addEventListener('load', () => {
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    console.log('✅ Uruchomiona jako aplikacja');
    document.getElementById('installBtn').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  }
  updateOfflineBanner();
});
</script>
